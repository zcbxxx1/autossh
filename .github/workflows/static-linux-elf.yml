name: Static Linux ELF

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
      - '[0-9]*'
  pull_request:

permissions:
  contents: write

jobs:
  build-x86_64-static:
    name: Build x86_64 static ELF
    runs-on: ubuntu-latest

    env:
      ARTIFACT_NAME: autossh-linux-x86_64-static

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static binary with musl
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            -e TARGET_NAME="$ARTIFACT_NAME" \
            alpine:3.20 \
            sh -euxc '
              apk add --no-cache build-base binutils file openssh-client tar
              sh ./scripts/build-static-linux.sh
            '
          sudo chown -R "$(id -u):$(id -g)" dist

      - name: Verify static ELF metadata
        run: |
          set -eux
          file "dist/$ARTIFACT_NAME"
          readelf -h "dist/$ARTIFACT_NAME"
          if readelf -l "dist/$ARTIFACT_NAME" | grep -q INTERP; then
            echo "binary is dynamically linked" >&2
            readelf -l "dist/$ARTIFACT_NAME" >&2
            exit 1
          fi
          "dist/$ARTIFACT_NAME" -V
          sha256sum "dist/$ARTIFACT_NAME" > "dist/$ARTIFACT_NAME.sha256"

      - name: Smoke test on supported distro containers
        run: |
          set -eux
          for image in \
            quay.io/centos/centos:7 \
            ubuntu:20.04 \
            ubuntu:22.04 \
            ubuntu:24.04 \
            ubuntu:latest \
            debian:stable-slim \
            almalinux:8 \
            almalinux:9 \
            rockylinux:9 \
            fedora:latest
          do
            echo "::group::$image"
            docker run --rm \
              -v "$PWD/dist:/dist:ro" \
              "$image" \
              "/dist/$ARTIFACT_NAME" -V
            echo "::endgroup::"
          done

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: autossh-linux-x86_64-static
          path: |
            dist/autossh-linux-x86_64-static
            dist/autossh-linux-x86_64-static.sha256
          if-no-files-found: error

      - name: Publish GitHub Release asset for tags
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "$tag" --notes "Static Linux x86_64 ELF build for autossh."
          gh release upload "$tag" \
            "dist/$ARTIFACT_NAME" \
            "dist/$ARTIFACT_NAME.sha256" \
            --clobber
